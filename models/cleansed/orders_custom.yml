version: 2

models:
  - name: orders_custom
    description: "This is an order table"
    columns:
      - name: order_id
        description: "This is a unique order id"
        tests:
          - unique
          - not_null
      - name: status
        description: "This is a status of order"
        data_tests:
          - accepted_values:
              arguments: 
                values:
                  - Shipped
                  - Delivered
                  - Cancelled
                  - Pending
                  - not_null
      - name: product_id
        description: "This is a product table"
        data_tests:
        - relationships:
            arguments: 
              to: ref('products_cleansed')
              field: product_id
      - name: order_date
        tests: 
          - date_range:
              arguments:
                start_date: '2024-01-21'
                end_date: '2030-01-01'
              config:
                severity: warn
      - name: quantity
        description: 'quantity can only be positive'
        tests:
          - positive_value:
              config:
                severity: error
                error_if: '> 10'
                warn_if: '> 0'